
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="#" class="logo">ShopEase<span>.</span></a>
    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#cart">Cart 🛒 <span id="cartCount">0</span></a>
    </nav>
</header>

<section class="hero" id="home">
    <div>
        <p class="tagline">WELCOME TO SHOPEASE</p>
        <h1>Shopping made <span>simple.</span></h1>
        <p>Discover quality products at affordable prices.</p>
        <a href="#products" class="btn">Shop Now</a>
    </div>
</section>

<main>
    <section class="products-section" id="products">
        <div class="section-heading">
            <div>
                <p class="tagline">OUR COLLECTION</p>
                <h2>Explore Products</h2>
            </div>
            <input type="search" id="searchInput"
                   placeholder="Search products...">
        </div>

        <div class="product-grid" id="productGrid"></div>
    </section>

    <section class="cart-section" id="cart">
        <p class="tagline">YOUR SELECTION</p>
        <h2>Shopping Cart</h2>

        <div id="cartItems"></div>

        <div class="cart-summary">
            <h3>Total: <span id="cartTotal">$0.00</span></h3>
            <button class="btn" id="placeOrderBtn">Place Order</button>
            <button class="cancel-btn" id="cancelOrderBtn">
                Cancel Order
            </button>
        </div>

        <p id="message" class="message"></p>
    </section>
</main>

<footer>
    <p>© 2026 ShopEase. Created for learning purposes.</p>
</footer>

<!-- Product Details Modal -->
<div class="modal" id="productModal">
    <div class="modal-content">
        <button class="close-btn" id="closeModal">&times;</button>
        <img id="modalImage" src="" alt="Product">
        <h2 id="modalName"></h2>
        <p id="modalDescription"></p>
        <h3 id="modalPrice"></h3>
        <button class="btn" id="modalAddBtn">Add to Cart</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
